packages:
  - apps/*
  - packages/*
  - tools/*

# Fail fast on the wrong Node version instead of half-working.
engineStrict: true

# One place for dependency versions. Packages reference these with "catalog:".
# Exact versions on purpose: upgrades are deliberate, reviewed changes.
catalog:
  "@biomejs/biome": 2.6.3
  "@fontsource-variable/archivo": 5.3.0
  "@fontsource-variable/inter": 5.3.0
  "@playwright/test": 1.64.1
  "@tailwindcss/vite": 4.3.3
  "@tesseract.js-data/eng": 1.0.0
  "@testing-library/dom": 10.4.2
  "@testing-library/react": 16.3.3
  "@types/node": 26.6.5
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-basic-ssl": 2.3.0
  "@vitejs/plugin-react": 6.1.2
  barcode-detector: 3.2.3
  dexie: 4.4.7
  fake-indexeddb: 6.2.6
  jsdom: 30.1.3
  react: 19.3.1
  react-dom: 19.3.1
  tailwindcss: 4.3.3
  tesseract.js: 7.0.0
  tesseract.js-core: 7.0.0
  tsx: 4.23.15
  typescript: 7.0.2
  vite: 8.3.5
  vitest: 5.0.5
  yaml: 2.9.1
  zod: 4.6.7
  zustand: 5.0.16
  zxing-wasm: 3.1.6

allowBuilds:
  esbuild: true
  # Its only script is opencollective-postinstall (a donation banner). Nothing to build.
  tesseract.js: false
