packages:
  - apps/*
  - packages/*
  - tools/*

# Fail fast on the wrong Node version instead of half-working.
engineStrict: true

# One place for dependency versions. Packages reference these with "catalog:".
# Exact versions on purpose: upgrades are deliberate, reviewed changes.
catalog:
  "@biomejs/biome": 2.6.3
  "@playwright/test": 1.64.1
  "@tailwindcss/vite": 4.3.3
  "@testing-library/dom": 10.4.2
  "@testing-library/react": 16.3.3
  "@types/node": 26.6.5
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-basic-ssl": 2.3.0
  "@vitejs/plugin-react": 6.1.2
  jsdom: 30.1.3
  react: 19.3.1
  react-dom: 19.3.1
  tailwindcss: 4.3.3
  tsx: 4.23.15
  typescript: 7.0.2
  vite: 8.3.5
  vitest: 5.0.5
  zod: 4.6.7

allowBuilds:
  esbuild: true
