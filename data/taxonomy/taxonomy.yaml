# FlowerScan controlled vocabulary (T-003). Field rules: docs/04-data-model.md "Taxonomy term".
# Each entry in `terms` must satisfy TaxonomyTermSchema (packages/core/src/schema/taxonomy-term.ts).
#
# Rules
# - Slugs are permanent. Never delete or rename one: set `status: deprecated` and `replaced_by: <slug>`.
# - Descriptions are one hedged sentence ("Often described as...", "Some people report..."). Nothing medical,
#   and nothing that appears in banned.yaml. Effect words describe how people report feeling, never a benefit.
# - Terpene descriptions are aroma-only. No pharmacology.
# - Synonyms are import inputs that map to the term. They are never displayed, and each one maps to one term only.
# - Polarity for effects follows how users rate the experience. "Context-specific" effects (wanted by some people,
#   avoided by others) are `neutral`. Flavors and terpenes are `neutral`.
#
# Sources (all retrieved 2026-10-26). The trailing `# src:` comment on each term lists the ones that back it.
#   M  docs/04-data-model.md, starter vocabulary (internal, compliance-reviewed draft)
#   D  docs/research/2026-10-26-domain-review.md section 5 (internal cannabis-expert review)
#   G  Gilbert AN, DiVerdi JA (2018). Consumer perceptions of strain differences in Cannabis aroma.
#      PLOS ONE 13(2):e0192247. doi:10.1371/journal.pone.0192247. CC BY 4.0. Table 1, 48 odor descriptors.
#      https://pmc.ncbi.nlm.nih.gov/articles/PMC5798829/
#   I  Isaacson SE et al. (2025). Beyond potency: a proposed lexicon for sensory differentiation of Cannabis
#      sativa L. aroma. PLOS ONE 20(10):e0335125. doi:10.1371/journal.pone.0335125. CC BY 4.0. Table 1, 25 terms.
#      https://pmc.ncbi.nlm.nih.gov/articles/PMC12539713/
#   O  Oswald IWH et al. (2023). Minor, nonterpenoid volatile compounds drive the aroma differences of exotic
#      Cannabis. ACS Omega 8(42):39203-39216. doi:10.1021/acsomega.3c04496. CC BY-NC-ND 4.0 (cited for facts only).
#      https://pmc.ncbi.nlm.nih.gov/articles/PMC10601067/
#   S  Stith SS et al. (2020). J Cannabis Res. doi:10.1186/s42238-020-00051-z. CC BY 4.0. (Full title omitted
#      here because it contains banned.yaml terms.) Table 3: 47 session-reported effects, each classed
#      positive / negative / context-specific. Used only for effect words and polarity, nothing else.
#      https://pmc.ncbi.nlm.nih.gov/articles/PMC7819324/
#   L  LaFrance EM et al. (2020). Overbaked: assessing and predicting acute adverse reactions to Cannabis.
#      J Cannabis Res. doi:10.1186/s42238-019-0013-x. CC BY 4.0. Table 2, 26 acute adverse reactions.
#      https://pmc.ncbi.nlm.nih.gov/articles/PMC7819287/
#   C  Smith CJ et al. (2022). The phytochemical diversity of commercial Cannabis in the United States.
#      PLOS ONE 17(5):e0267498. doi:10.1371/journal.pone.0267498. CC BY 4.0. Terpene names as measured.
#      https://pmc.ncbi.nlm.nih.gov/articles/PMC9119530/
#   P  PubChem compound records, "Odor" and description sections (NCBI). CIDs: limonene 22311, myrcene 31253,
#      beta-caryophyllene 5281515, alpha-pinene 6654, linalool 6549, terpinolene 11463, beta-ocimene 18756.
#      https://pubchem.ncbi.nlm.nih.gov/compound/<CID>
#   W  Wikipedia, "Humulene" (CC BY-SA 4.0). https://en.wikipedia.org/wiki/Humulene
#
# Synonym rule: a synonym comes from a source above, or is a plain spelling variant of the label
# (skunky, minty, couch locked).

taxonomy_version: 1

