# FlowerScan banned terms (T-003). Policy: docs/09-compliance-and-privacy.md "Claims", docs/04 "Banned from
# the taxonomy entirely", and docs/research/2026-10-26-domain-review.md section 5.
#
# What it's for
#   The build (vault-build) and the core `assertNoBannedTerms` check fail if any entry below appears in text we
#   author: taxonomy slugs, labels, descriptions and synonyms, vault tags, UI copy (`copy.ts`), rendered
#   result screens, and exports. It stops medical-condition and therapeutic-claim wording from shipping.
#
# What it is NOT for
#   OCR text read from packages. Package warnings legitimately say things like "patients" (MI), so scan input is
#   never checked against this list (domain review section 5, scope note).
#   Strain names are proper nouns we don't author. Whether they are exempt is still open (see the T-003 Log).
#
# How matching works (for whoever implements the check)
#   - Case-insensitive.
#   - Whole words or whole phrases only. An entry matches where the characters just before and after it are
#     not letters or digits. So `pain` matches "pain" and "pain-free", but not "paint" or "Spain".
#   - A space inside a phrase matches any run of whitespace.
#   - No stemming and no fuzzy matching: every inflection we want to catch is listed explicitly.
#   - Hyphenated and unhyphenated spellings are listed separately where both are common.
#   - All four lists are checked the same way. The grouping only makes review easier.
#
# Deliberately NOT listed (they would break legitimate copy or vocabulary; review before adding):
#   - "treat": current result and About copy uses it as a verb ("treat it as an estimate"). "treats",
#     "treating" and "treatment" are listed.
#   - "stress", "sleep", "appetite", "calm": everyday words and taxonomy vocabulary. Only the claim phrases are
#     listed ("stress relief", "sleep aid", "appetite stimulant").
#   - "add" / "ms": acronyms that collide with ordinary words.
#
# Entries are lowercase. Keep each list alphabetical.

banned_version: 1

