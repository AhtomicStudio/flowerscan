name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm vault:check
      # The web build and e2e tests use the compiled strain data (beta: includes unverified notes, D19).
      - run: pnpm vault:build --include-unverified
      - run: pnpm build

      - name: Install Playwright browser
        run: pnpm --filter @flowerscan/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
