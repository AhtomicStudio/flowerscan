/* ==========================================================================

:root {

  --color-danger: #FF6B5E; --color-on-danger: #0B0D0C;
  --color-class-indica-ink: #A88BFF; --color-class-hybrid-ink: #3EDB7A; --color-class-sativa-ink: #FFB547; --color-class-unknown-ink: #A3ACA7;

  --color-bg: #F5F7F6; --color-surface-1: #FFFFFF; --color-surface-2: #EEF1EF; --color-surface-3: #E2E6E4;

.cls-indica { --cls: var(--color-class-indica); --cls-ink: var(--color-class-indica-ink); }

/* ========================================================================== Base */
* { box-sizing: border-box; }

/* Device frame: full screen on phones, a 390 x 844 frame on desktop */

@media (min-width: 560px) {

  #device { position: relative; inset: auto; width: 390px; height: 844px; border-radius: 48px; box-shadow: 0 0 0 10px #1b1f1d, 0 0 0 11px #333, 0 40px 80px rgba(0,0,0,.6); }
}

.screen { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; background: var(--color-bg); color: var(--color-text); padding: calc(var(--safe-top) + 20px) 20px calc(var(--tabbar) + var(--safe-bottom) + 32px); scroll-padding-bottom: calc(var(--tabbar) + 24px); }
.screen.no-tabs { padding-bottom: calc(var(--safe-bottom) + 24px); }

.page-title { font-size: var(--text-title); line-height: 1.15; margin: 12px 0 4px; }
.caption { font-size: var(--text-caption); line-height: 1.4; color: var(--color-text-3); font-weight: 500; }
.foot { font-size: var(--text-footnote); line-height: 1.45; color: var(--color-text-2); }
.section-h { font-size: var(--text-caption); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--color-text-3); margin: 28px 0 8px; }
.appbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: -8px -8px 8px; min-height: 48px; }

/* Buttons */
.btn { min-height: 52px; padding: 0 20px; border-radius: var(--radius-md); display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: var(--text-body); line-height: 1.2; text-align: center; transition: transform var(--motion-instant) var(--ease-out), filter var(--motion-instant); }

.btn-stack { display: grid; gap: 12px; }
.icon-btn { width: 48px; height: 48px; border-radius: 50%; display: inline-grid; place-items: center; flex: none; transition: transform var(--motion-instant); }
.icon-btn:active { transform: scale(.92); }
.linkish { color: var(--color-accent-text); font-weight: 600; min-height: 48px; display: inline-flex; align-items: center; gap: 4px; }

/* Tab bar */
.tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--tabbar) + var(--safe-bottom)); padding-bottom: var(--safe-bottom); display: flex; background: var(--color-surface-1); border-top: 1px solid var(--color-border); z-index: 5; }
.dark-scope .tabbar { background: var(--color-bg); }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: var(--color-text-2); font-size: var(--text-caption); font-weight: 500; position: relative; min-width: 48px; }
.tab[aria-current="page"] { color: var(--color-accent-text); font-weight: 700; }
.tab[aria-current="page"]::before { content: ""; position: absolute; top: 4px; width: 32px; height: 4px; border-radius: 2px; background: currentColor; }

/* ========================================================================== Scanner (always dark) */
.scanner { padding: 0; overflow: hidden; background: #000; }
.feed { position: absolute; inset: 0; background: radial-gradient(120% 70% at 50% 35%, #4a463d 0%, #26241f 45%, #0d0c0a 100%); transition: filter .2s; }
.feed::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, rgba(255,255,255,.015) 0 2px, transparent 2px 9px); pointer-events: none; }
.feed.frozen { filter: saturate(.7) brightness(.85); }
.feed.off { background: #050606; }
.feed.off .pkg { display: none; }
.flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; animation: flash .25s ease-out; }
@keyframes flash { 0% { opacity: .08 } 100% { opacity: 0 } }
.pkg { position: absolute; left: 50%; top: 18%; width: 74%; height: 44%; transform: translateX(-50%) rotate(-2.5deg); background: linear-gradient(160deg, #e9e4d8, #cfc8b7); border-radius: 14px; box-shadow: 0 30px 60px rgba(0,0,0,.6); color: #23211c; padding: 18px 18px; font-family: var(--font-ui); }

.pkg-label b { display: block; font-family: var(--font-display); font-stretch: 85%; font-weight: 800; font-size: 34px; line-height: 1; margin: 6px 0 4px; letter-spacing: .02em; }
.pkg-label span { display: block; font-size: 12px; font-weight: 600; letter-spacing: .08em; }
.pkg-claim { display: inline-block !important; margin-top: 8px; border: 1.5px solid #23211c; border-radius: 4px; padding: 1px 6px; font-size: 11px !important; }
.pkg-warn { position: absolute; left: 18px; right: 110px; bottom: 16px; font-size: 7px; line-height: 1.3; opacity: .55; letter-spacing: .02em; }
.pkg-barcode { position: absolute; right: 16px; bottom: 14px; width: 86px; height: 58px; background: #fff; border-radius: 3px; padding: 5px 6px 2px; display: flex; flex-direction: column; gap: 2px; }
.pkg-barcode i { flex: 1; background: repeating-linear-gradient(90deg, #111 0 2px, #fff 2px 3px, #111 3px 4px, #fff 4px 6px, #111 6px 9px, #fff 9px 10px); }
.pkg-barcode span { font-size: 7px; color: #111; text-align: center; letter-spacing: .1em; }
.topbar { position: absolute; left: 0; right: 0; top: 0; padding: calc(var(--safe-top) + 8px) 12px 28px 20px; display: flex; align-items: center; justify-content: space-between; background: linear-gradient(rgba(0,0,0,.6), transparent); color: #fff; z-index: 2; }
.wordmark { font-family: var(--font-display); font-stretch: 80%; font-weight: 800; font-size: 1.25rem; letter-spacing: .01em; }
.torch[aria-pressed="true"] { background: #fff; color: #0B0D0C; }
.reticle { position: absolute; left: 10%; width: 80%; top: 21%; height: 26%; transition: all var(--motion-fast) var(--ease-snap); z-index: 1; pointer-events: none; }
.reticle i { position: absolute; width: 34px; height: 34px; border: 0 solid #fff; filter: drop-shadow(0 0 1px #0B0D0C) drop-shadow(0 0 0 #0B0D0C); }
.reticle i.tl { left: 0; top: 0; border-left-width: 3px; border-top-width: 3px; border-top-left-radius: 16px; }
.reticle i.tr { right: 0; top: 0; border-right-width: 3px; border-top-width: 3px; border-top-right-radius: 16px; }
.reticle i.bl { left: 0; bottom: 0; border-left-width: 3px; border-bottom-width: 3px; border-bottom-left-radius: 16px; }
.reticle i.br { right: 0; bottom: 0; border-right-width: 3px; border-bottom-width: 3px; border-bottom-right-radius: 16px; }
.reticle.locked i { border-color: #5CE1FF; width: 22px; height: 22px; }
.reticle.locked { animation: pulse .5s .2s ease-out; }
@keyframes pulse { 50% { transform: scale(1.06); } }
.shimmer { position: absolute; inset: 6px; border-radius: 12px; overflow: hidden; }
.shimmer::before { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -40%; background: linear-gradient(90deg, transparent, rgba(92,225,255,.35), transparent); animation: sweep 1.2s linear 4; }
@keyframes sweep { to { left: 100%; } }
.hint { position: absolute; left: 50%; top: calc(21% + 26% + 16px); transform: translateX(-50%); width: max-content; max-width: 88%; background: rgba(0,0,0,.6); color: #fff; border-radius: var(--radius-pill); padding: 8px 16px; font-size: var(--text-footnote); font-weight: 500; text-align: center; z-index: 2; }
.hint .btn-row { margin-top: 8px; }
.hint .btn { min-height: 44px; font-size: var(--text-footnote); }
.hint.box { border-radius: 18px; padding: 12px 14px; }
.progress { height: 6px; border-radius: 3px; background: rgba(255,255,255,.2); margin-top: 8px; overflow: hidden; }
.progress > b { display: block; height: 100%; width: 0; background: #5CE1FF; transition: width 2.4s linear; }
.scan-bottom { position: absolute; left: 0; right: 0; bottom: calc(var(--tabbar) + var(--safe-bottom)); padding: 40px 16px 14px; background: linear-gradient(transparent, rgba(0,0,0,.72) 35%); z-index: 2; color: #fff; }
.modes { display: flex; justify-content: center; margin: 0 auto 16px; background: rgba(0,0,0,.6); border-radius: var(--radius-pill); padding: 4px; width: max-content; max-width: 100%; }
.mode { position: relative; min-height: 40px; min-width: 64px; padding: 0 12px; border-radius: var(--radius-pill); font-size: var(--text-footnote); font-weight: 600; color: #F1F4F2; }
.mode::after { content: ""; position: absolute; inset: -4px 0; } /* 40 px pill + 4 px each side = 48 px hit area */
.mode[aria-checked="true"] { background: #F1F4F2; color: #0B0D0C; }
.controls { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
.side { justify-self: center; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: var(--text-caption); font-weight: 600; color: #fff; min-width: 64px; }
.side .disc { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: rgba(0,0,0,.55); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.55); }
.shutter { width: var(--size-shutter); height: var(--size-shutter); border-radius: 50%; background: #fff; box-shadow: 0 0 0 1px #0B0D0C, inset 0 0 0 4px #fff, inset 0 0 0 6px #0B0D0C; transition: transform var(--motion-instant) var(--ease-snap); }
.shutter:active, .shutter.pressed { transform: scale(.92); }
.ring { width: var(--size-shutter); height: var(--size-shutter); border-radius: 50%; box-shadow: inset 0 0 0 3px #5CE1FF, 0 0 0 1px #0B0D0C; position: relative; }
.ring::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid #5CE1FF; animation: radar 1.6s ease-out 3; opacity: 0; }
@keyframes radar { 0% { transform: scale(.8); opacity: .8 } 100% { transform: scale(1.25); opacity: 0 } }
.thumb { width: 56px; height: 56px; border-radius: 14px; background: var(--color-class-hybrid); color: #0B0D0C; display: grid; place-items: center; box-shadow: 0 0 0 1.5px rgba(255,255,255,.7); }
.cam-panel { position: absolute; left: 0; right: 0; top: 0; bottom: calc(var(--tabbar) + var(--safe-bottom)); overflow-y: auto; background: var(--color-surface-1); padding: calc(var(--safe-top) + 72px) 24px 24px; }
.cam-panel .ic.xl { color: var(--color-text-2); margin-bottom: 16px; }
.cam-panel h1 { font-size: var(--text-title); line-height: 1.15; margin-bottom: 8px; }
.cam-panel ol { padding-left: 20px; margin: 12px 0 24px; color: var(--color-text-2); font-size: var(--text-footnote); }
.cam-panel ol li { margin-bottom: 6px; }
.steps-card { background: var(--color-surface-2); border-radius: var(--radius-md); padding: 14px 16px 2px; margin: 16px 0 24px; }
.steps-card b { font-size: var(--text-footnote); }
.inline-note { margin-top: 12px; font-size: var(--text-footnote); color: var(--color-text-2); }

/* Start-camera + camera card */
.center-cta { position: absolute; left: 50%; top: 34%; transform: translate(-50%, -50%); z-index: 3; text-align: center; color: #fff; width: 80%; }
.center-cta p { margin-top: 12px; font-size: var(--text-footnote); color: #B4BDB8; }
.card-screen { display: flex; flex-direction: column; padding-top: calc(var(--safe-top) + 48px); }
.card-art { margin: 24px auto 32px; width: 220px; height: 160px; position: relative; }
.card-art .r { position: absolute; inset: 0; }
.card-art .r i { position: absolute; width: 40px; height: 40px; border: 0 solid var(--color-accent); }
.card-art .r i.tl { left: 0; top: 0; border-left-width: 3px; border-top-width: 3px; border-top-left-radius: 18px; }
.card-art .r i.tr { right: 0; top: 0; border-right-width: 3px; border-top-width: 3px; border-top-right-radius: 18px; }
.card-art .r i.bl { left: 0; bottom: 0; border-left-width: 3px; border-bottom-width: 3px; border-bottom-left-radius: 18px; }
.card-art .r i.br { right: 0; bottom: 0; border-right-width: 3px; border-bottom-width: 3px; border-bottom-right-radius: 18px; }
.card-art .dots { position: absolute; inset: 34px 30px; display: flex; gap: 10px; align-items: center; justify-content: center; }
.card-art .dots span { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; color: #0B0D0C; animation: bob 2.4s var(--ease-out) infinite; }
.card-art .dots span:nth-child(2) { animation-delay: .2s } .card-art .dots span:nth-child(3) { animation-delay: .4s }
@keyframes bob { 0%, 70%, 100% { transform: translateY(0) } 35% { transform: translateY(-8px) } }
.grow { flex: 1; }

/* ========================================================================== Sheet */
.scrim { position: absolute; inset: 0; background: rgba(0,0,0,.6); z-index: 20; animation: fade var(--motion-standard) var(--ease-out); }
@keyframes fade { from { opacity: 0 } }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 640px; z-index: 21; display: flex; flex-direction: column; background: var(--color-surface-1); color: var(--color-text); border-radius: var(--radius-lg) var(--radius-lg) 0 0; box-shadow: 0 -12px 40px rgba(0,0,0,.55); height: 72%; transition: height .32s var(--ease-out); overflow: hidden; }
.sheet[data-detent="large"] { height: calc(100% - var(--safe-top) - 12px); }
.sheet[data-detent="auto"] { height: auto; max-height: calc(100% - var(--safe-top) - 12px); }
.sheet.enter { animation: rise .42s var(--ease-spring); }
@keyframes rise { from { transform: translateY(100%) } }
.sheet.swap .sheet-scroll { animation: fade .2s var(--ease-out); }
.sheet-scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; scroll-padding-bottom: 24px; }
.sheet-top { display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; padding: 4px 8px 0; }
.grabber { width: 48px; height: 48px; justify-self: center; display: grid; place-items: center; grid-column: 2; }
.grabber span { width: 36px; height: 5px; border-radius: 3px; background: currentColor; opacity: .55; }
.sheet-top .close { grid-column: 3; }
.sheet-body { padding: 0 20px 24px; }
.sheet-title { font-size: var(--text-headline); font-weight: 700; line-height: 1.3; margin: 0 0 6px; }
.sheet-actions { flex: none; display: flex; gap: 12px; padding: 12px 20px calc(12px + var(--safe-bottom)); background: var(--color-surface-1); border-top: 1px solid var(--color-border); }
.sheet-actions .btn { flex: 1; }

/* ========================================================================== Result */
.hero { background: var(--cls); color: var(--color-on-class); padding: 0 20px 20px; }
.page-hero { border-radius: var(--radius-lg); padding-top: 18px; margin: 0 0 4px; }
.hero-name { font-size: var(--text-title); line-height: 1.15; overflow-wrap: anywhere; }
.hero-class { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
.hero-word { font-size: var(--text-display); line-height: 1.05; }
.hero-sub { font-size: var(--text-headline); font-weight: 700; line-height: 1.3; }
.hero-parents { font-size: var(--text-footnote); font-weight: 500; margin-top: 6px; }
.chip-conf { margin-top: 12px; min-height: 40px; padding: 0 12px 0 10px; border-radius: var(--radius-pill); display: inline-flex; align-items: center; gap: 6px; box-shadow: inset 0 0 0 1.5px var(--color-on-class); font-weight: 600; font-size: var(--text-footnote); color: var(--color-on-class); position: relative; }
.chip-conf::after { content: ""; position: absolute; inset: -4px 0; } /* 48 px hit area */
.chip-conf[aria-expanded="true"] { background: rgba(11,13,12,.12); }
.explain { margin-top: 10px; padding: 12px 14px; border-radius: 12px; font-size: var(--text-footnote); line-height: 1.45; }
.hero .explain { background: rgba(11,13,12,.12); color: var(--color-on-class); }
.body-explain { background: var(--color-surface-2); color: var(--color-text); }
.meter { padding: 20px 20px 0; }
.meter-labels { display: flex; justify-content: space-between; align-items: baseline; font-variant-numeric: tabular-nums; color: var(--color-text-2); font-size: var(--text-footnote); }
.meter-labels b { color: var(--color-text); font-size: var(--text-headline); font-weight: 700; }

  const s = S[id], lin = s.lineage, facts = opt.facts || {}, mode = opt.mode; // mode: sheet | page | journal
  const uid = "r" + Math.random().toString(36).slice(2, 7);
  const parents = s.parents.length ? s.parents.slice(0, 2).map(p => p === "unknown" ? "unknown parent" : esc(S[p].name)).join(" × ") + (s.parents.length > 2 ? ` +${s.parents.length - 2}` : "") : "";
  const chip = s.kind === "landrace" ? { t: "Landrace", i: "bookmark", e: { high: "A traditional regional population. Its value comes from our landrace rubric, on a coarse 10 / 25 / 50 / 75 / 90 scale, backed by two sources." } } : CHIP[lin.method];
  const H = mode === "sheet" ? "h2" : "h1";
  let hero = `<header class="hero cls-${lin.label} ${mode === "sheet" ? "" : "page-hero"}">
    ${mode === "sheet" ? `<div class="sheet-top" style="margin:0 -12px"><button class="grabber" type="button" data-act="detent" aria-label="Expand" aria-expanded="false"><span></span></button>
      <button class="icon-btn close" type="button" data-act="close-sheet" aria-label="Close">${icon("x")}</button></div>` : ""}
    <${H} class="display hero-name" id="sheet-title" tabindex="-1" data-focus>${esc(s.name)}</${H}>
    <p class="hero-class">${icon(CLS[lin.label].i, "lg")}<span class="display hero-word">${CLS[lin.label].w}</span></p>
    ${lin.sublabel ? `<p class="hero-sub">${SUB[lin.sublabel]}</p>` : ""}
    ${parents ? `<p class="hero-parents">${parents}</p>` : ""}
    ${chip ? `<button class="chip-conf" type="button" data-act="explain" aria-expanded="false" aria-controls="${uid}-c">${icon(chip.i, "sm")}${chip.t}${icon("info", "sm")}</button>
      <div class="explain" id="${uid}-c" hidden>${chip.e[lin.confidence_level] || chip.e.medium}</div>` : ""}
  </header>`;
  // Meter
  let meter = "";
  const ce = closeEdge(lin.sativa_pct);
  const estimateInfo = `<button class="info-btn" type="button" data-act="explain" aria-expanded="false" aria-controls="${uid}-m">Lineage estimate, not a lab test. ${icon("info", "sm")}</button>`;
  const estimateText = `<div class="explain body-explain" id="${uid}-m" hidden>It's an average of how its ancestors are usually classified, carried down the family tree. It isn't a DNA or lab measurement, and it doesn't predict how a strain feels. <a href="#/about/classification">How classification works</a></div>`;
  if (lin.method === "unknown") {
    meter = `<div class="unknown-panel">${icon("help")}<div><p><b>We don't have enough of its family tree to estimate it.</b></p><p class="foot">We only show what our data supports.</p><a class="linkish" href="#/about/classification">How classification works ${icon("chev", "sm")}</a></div></div>`;
  } else if (lin.method === "reported") {
    const r = BAND_RANGE[s.reported_type];
    meter = `<div class="meter"><div class="meter-labels"><span>Indica</span><span>Sativa</span></div>
      <div class="track" aria-hidden="true">${EDGES.map(e => `<span class="tick" style="left:${e}%"></span>`).join("")}<span class="band" style="left:${r[0]}%;width:${r[1] - r[0]}%"></span></div>
      <p class="sr-only">Described as ${REPORTED[s.reported_type]}. No family tree estimate.</p>
      <div class="meter-cap"><span>Based on how it's described, not its family tree.</span></div></div>`;
  } else {
    const p = lin.sativa_pct, i = lin.indica_pct;
    meter = `<div class="meter"><div class="meter-labels"><span class="${i > p ? "lean" : ""}">Indica <b class="num">${i}%</b></span><span class="${p > i ? "lean" : ""}">Sativa <b class="num">${p}%</b></span></div>
      <div class="track" aria-hidden="true">${EDGES.map(e => `<span class="tick" style="left:${e}%"></span>`).join("")}<span class="knob" data-pos="${p}"></span></div>
      <p class="sr-only">Lineage estimate: ${p}% sativa, ${i}% indica.</p>
      <div class="meter-cap">${estimateInfo}${ce >= 0 ? `<button class="badge" type="button" data-act="explain" aria-expanded="false" aria-controls="${uid}-l">${icon("ruler", "sm")}Close to the line</button>` : ""}</div>
      ${estimateText}
      ${ce >= 0 ? `<div class="explain body-explain" id="${uid}-l" hidden>${p} is close to the cutoff between ${BANDS[ce]} and ${BANDS[ce + 1]}. A small change in the family tree would change the label.</div>` : ""}</div>`;
  }
  // Package says (only opposite directions, P8; scans only)
  const opp = mode !== "page" && opposite(facts.package_says, lin);
  const callout = opp ? `<aside class="callout" aria-label="Package and family tree disagree">${icon("split")}<div><p>Package says <b>${CLS[facts.package_says].w}</b>.</p><p>The family tree leans <b>${lin.label === "hybrid" ? SUB[lin.sublabel] : CLS[lin.label].w}</b>.</p>
    <button class="linkish" type="button" data-act="open-how" data-how="${uid}">How we got ours ${icon("chev", "sm")}</button></div></aside>` : "";
  const factsRow = mode === "sheet" && facts.product_form ? `<p class="facts">${icon("pkg", "sm")}<span>From the package: <b>${esc(facts.product_form)}</b></span></p>` : "";
  // Tags (0..n, no filler)
  const facet = (label, list, key) => {
    if (!list || !list.length) return "";
    const lid = `${uid}-${key}`;
    return `<div class="facet"><h4 class="facet-h">${label}</h4><ul class="tags" id="${lid}">${list.map((t, n) => `<li class="tag ${n >= 8 ? "extra" : ""}" style="--i:${Math.min(n, 9)}">${esc(t)}</li>`).join("")}</ul>
      ${list.length > 8 ? `<button class="more" type="button" data-act="more" data-list="${lid}" data-n="${list.length - 8}">+${list.length - 8} more</button>` : ""}</div>`;
  };
  const tagHtml = facet("Effects", s.effects, "e") + facet("Also reported", s.negative, "n") + facet("Flavors", s.flavors, "f") + facet("Terpenes", s.terpenes, "t");
  const tags = tagHtml ? `<section class="rblock" aria-labelledby="${uid}-th"><h3 class="block-h" id="${uid}-th">Commonly reported</h3>${tagHtml}
    <p class="caption" style="margin-top:10px">From ${s.source_count} sources · <button class="linkish" style="min-height:40px;font-size:inherit" type="button" data-act="open-how" data-how="${uid}">How we know</button></p></section>` : "";
  // How we know
  const ids = new Set(); let disputed = 0;
  const walk = (nid, d) => { if (nid === "unknown") return; const n = S[nid]; if (d > 0) ids.add(nid); if (n.verification === "disputed") disputed++; if (d < 3) n.parents.forEach(x => walk(x, d + 1)); };
  walk(id, 0);
  const tree = s.parents.length ? `<ul class="tree" aria-label="Family tree">${treeNode(id, 0, true)}</ul>`
    : s.kind === "landrace" ? `<p><b>A landrace is where our family trees stop.</b> Its value follows our written landrace rubric.</p>` : `<p><b>We don't have its family tree yet.</b></p>`;
  const pk = facts.package_says && mode !== "page" ? `<p>Package says <b>${CLS[facts.package_says].w}</b>.${opp ? " See the note above." : ""}${lin.label === "unknown" ? " We can't compare it: the family tree is unknown." : ""}</p>` : "";
  const how = `<section class="rblock" id="${uid}-howsec"><button class="disclosure" type="button" data-act="how" aria-expanded="false" aria-controls="${uid}-how" id="${uid}-howbtn">
      <span><b>How we know</b><small>${s.parents.length ? `Family tree · ${ids.size} ancestors · ` : ""}${s.source_count} source${s.source_count === 1 ? "" : "s"}${disputed ? ` · ${disputed} disputed` : ""}</small></span>${icon("chev", "chev")}</button>
    <div class="how" id="${uid}-how" hidden>${tree}
      ${(lin.method === "traced" || lin.method === "partial") && REPORTED[s.reported_type] ? `<p>Sources describe it as <b>${REPORTED[s.reported_type]}</b>.</p>` : ""}
      ${pk}<p>Based on ${s.source_count} source${s.source_count === 1 ? "" : "s"}. <a href="#/about/classification">How classification works</a></p></div></section>`;
  const savedKey = opt.saveKey || id;
  const saved = state.saved[savedKey];
  const actions = mode === "journal" ? "" : actionsHtml(savedKey, saved);
  const rate = mode === "journal" ? "" : `<div class="rate-row" id="rate-${savedKey}" ${saved ? "" : "hidden"}><p>Rate it for your journal (optional)</p>${starsHtml(savedKey)}</div>`;
  const lead = `${meter}${callout}${factsRow}`, rest = `${tags}${how}<p class="result-foot">Effects vary person to person. Start low, go slow.</p>`;
  const body = lead + rest;
  return { hero, body, lead, rest, actions, rate, announce: `Result: ${s.name}. ${lin.label === "unknown" ? "Unknown lineage" : classText(lin) + (lin.method === "reported" ? ". Described by sources" : `. Lineage estimate ${lin.sativa_pct} percent sativa`)}${chip ? ". " + chip.t : ""}.` };
}
function treeNode(nid, d, root) {
  if (nid === "unknown") return `<li><div class="node unknown"><span class="nm">${icon("help", "sm")}Unknown parent</span></div></li>`;
  const n = S[nid], lin = n.lineage;
  const val = lin.method === "reported" ? "described" : lin.sativa_pct == null ? "" : lin.sativa_pct;
  const name = root ? `<span class="nm">${esc(n.name)}</span>` : `<a href="#/s/${nid}">${esc(n.name)}</a>`;
  const kids = d < 3 && n.parents.length ? `<ul>${n.parents.map(x => treeNode(x, d + 1)).join("")}</ul>` : "";
  const ends = !n.parents.length && n.kind !== "landrace" ? `<p class="tree-note">Origins of ${esc(n.name)} are unknown.</p>` : "";
  const disp = n.verification === "disputed" ? `<button class="badge" type="button" data-act="explain" aria-expanded="false" aria-controls="d-${nid}-${d}">${icon("fork", "sm")}Lineage disputed</button>` : "";
  return `<li><div class="node">${name}${n.kind === "landrace" ? '<span class="kind">Landrace</span>' : ""}${pill(lin)}<span class="val">${val}</span>${disp}</div>
    ${disp ? `<div class="explain body-explain" id="d-${nid}-${d}" hidden>Sources disagree about this strain's parents. We show the best-supported version.</div>` : ""}${ends}${kids}</li>`;
}
function actionsHtml(key, saved) {

    ${saved ? `<button class="btn primary saved-btn" type="button" data-go="#/journal/${state.extraJournal.find(e => e.key === key)?.id || "j1"}">${icon("check", "sm")}Saved</button>`
      : `<button class="btn primary" type="button" data-act="save" data-key="${key}">Save</button>`}
    <button class="btn secondary" type="button" data-act="share" data-key="${key}">${icon("share", "sm")}Share link</button></div>`;
}
function starsHtml(key) {
  const r = state.ratings[key] || 0;
  return `<div class="stars" role="radiogroup" aria-label="Your rating">${[1, 2, 3, 4, 5].map(n => `<button class="star ${n <= r ? "on" : ""}" type="button" role="radio" aria-checked="${n === r}" aria-label="${n} star${n > 1 ? "s" : ""}" data-act="rate" data-key="${key}" data-n="${n}">${icon("star")}</button>`).join("")}</div>`;

function scanSheet(kind, arg) {

  }

    const c = ["marsh-wren-4", "marsh-wren-7", "marsh-wren"];

      return `<li><button class="row" type="button" data-act="pick" data-id="${id}"><span><span class="t">${esc(m[1])}${m[2] ? `<span class="num-em">${esc(m[2])}</span>` : ""}</span>
      <span class="s">${s.breeder ? `${esc(s.breeder)} ·` : ""} ${pill(s.lineage)}</span></span>${icon("chev", "chev")}</button></li>`; }).join("");
    return sheetShell(`<p class="foot" style="margin-bottom:16px">We read <q>MARSH WREN</q>. Pick the one on your package.</p><ul class="rows">${rows}</ul>

  if (kind === "cross") {
    const rows = ["kestrel-haze", "sandpiper"].map(id => `<li><a class="row" href="#/s/${id}"><span><span class="t">${esc(S[id].name)}</span><span class="s">Parent, not a match · ${pill(S[id].lineage)}</span></span>${icon("chev", "chev")}</a></li>`).join("");

      <input class="field" id="readtext" type="search" enterkeyhint="search" value="${blank ? "" : "PREMIUM FLOWER"}" placeholder="Type the strain name" autocomplete="off" autocapitalize="off" spellcheck="false">
      ${blank ? "" : `<details style="margin-top:8px"><summary class="linkish" style="list-style:none;cursor:pointer">See all the text we read</summary>
        <ul class="foot" style="margin:4px 0 0;padding-left:20px"><li>PREMIUM FLOWER</li><li>NET WT 3.5G</li><li>LOT 2231-B</li><li>GOVERNMENT WARNING…</li></ul></details>`}
      <div class="btn-row" style="margin-top:16px">${blank ? `<button class="btn primary" type="button" data-go="#/scan/textshot" data-replace>Try again</button><button class="btn secondary" type="button" data-act="search-read">Search</button>`
        : `<button class="btn primary" type="button" data-act="search-read">Search</button><button class="btn secondary" type="button" data-go="#/scan/textshot" data-replace>Try again</button>`}</div>
      <hr style="border:0;border-top:1px solid var(--color-border);margin:20px 0 4px">
      <p class="foot">We don't have this strain yet? <button class="linkish" type="button" data-act="request">Request it</button></p>

      { title: blank ? "We couldn't read any text there." : "We couldn't find a strain in that label.", announce: blank ? "No text found" : "No match found" });

      <div class="btn-stack"><button class="btn primary block" type="button" data-act="scan-label">${icon("scan", "sm")}Scan the label</button>

      ${kind === "coa" ? `<button class="btn tertiary" type="button" data-act="open-link">${icon("ext", "sm")}Open link</button>` : ""}</div>`, { title: t[0], announce: "Barcode not recognized" });
  }

      { title: "We couldn't read that label.", announce: "Couldn't read the label" });

}

/* ========================================================================== Pages */
function strainPage(id) {
  if (!S[id]) {

      <div class="empty">${icon("help", "xl")}<h1 class="sheet-title" tabindex="-1" data-focus>We can't find that strain.</h1><p>The link may be old, or the strain may have a new name.</p>
      <div class="btn-stack"><button class="btn primary block" type="button" data-go="#/search">Search strains</button><button class="btn secondary block" type="button" data-go="#/scan">Open scanner</button></div></div>${tabbar("scan")}</main>`;
  }
  const r = resultView(id, { mode: "page", saveKey: id });
  return `<main class="screen flush"><div style="padding:0 20px"><div class="appbar"><button class="icon-btn" type="button" data-act="back" aria-label="Back">${icon("back")}</button></div>${r.hero}</div>
    ${r.lead}<div style="margin-top:16px">${r.rate}${r.actions.replace('class="sheet-actions"', 'class="sheet-actions" style="border:0;background:none;padding-bottom:12px"')}</div>${r.rest}${tabbar("scan")}</main>`;
}
function searchScreen() {
  return `<main class="screen"><div class="searchbar"><button class="icon-btn" type="button" data-act="back" aria-label="Back">${icon("back")}</button>
    <div class="wrap">${icon("search")}<label class="sr-only" for="q">Search strains</label><input class="field" id="q" type="search" enterkeyhint="search" placeholder="Search strains" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(state.q)}">
    <button class="icon-btn clear" type="button" data-act="clear-q" aria-label="Clear search">${icon("x", "sm")}</button></div></div>
    <div id="results"></div>${tabbar("scan")}</main>`;
}
function initSearch() {
  const q = $("#q"); if (!q) return;
  const render = () => {
    const v = q.value.trim().toLowerCase(); state.q = q.value;
    const out = $("#results");
    if (!v) {
      const rec = [...new Set(journalEntries().filter(e => e.strain).map(e => e.strain))].slice(0, 5);
      out.innerHTML = (rec.length ? `<h2 class="section-h">Recent</h2><ul class="rows">${rec.map(id => resRow(id, "")).join("")}</ul>` : "") +
        `<p class="caption" style="margin-top:20px">Tip: try a nickname or how it's spelled on the package.</p>`;
      return;
    }
    const hits = Object.entries(S).filter(([, s]) => s.name.toLowerCase().includes(v) || (s.aliases || []).some(a => a.toLowerCase().includes(v)));
    clearTimeout(initSearch.t); initSearch.t = setTimeout(() => say(hits.length ? `${hits.length} result${hits.length > 1 ? "s" : ""}` : "No results"), 500);
    out.innerHTML = hits.length ? `<p class="caption" style="margin:4px 0 10px">${hits.length} result${hits.length > 1 ? "s" : ""}</p><ul class="rows">${hits.map(([id]) => resRow(id, v)).join("")}</ul>`
      : `<div class="empty" style="padding-top:32px">${icon("search", "xl")}<h2>No strains match “${esc(q.value)}”.</h2><p>Check the spelling, or try fewer words.</p></div>
         <p class="foot" style="text-align:center">We don't have this strain yet? <button class="linkish" type="button" data-act="request">Request it</button></p>`;
  };
  q.addEventListener("input", render); render();
  setTimeout(() => q.focus(), 60);
}
function resRow(id, v) {
  const s = S[id]; const hl = t => { if (!v) return esc(t); const i = t.toLowerCase().indexOf(v); return i < 0 ? esc(t) : esc(t.slice(0, i)) + "<mark>" + esc(t.slice(i, i + v.length)) + "</mark>" + esc(t.slice(i + v.length)); };
  const alias = v && !s.name.toLowerCase().includes(v) ? (s.aliases || []).find(a => a.toLowerCase().includes(v)) : null;
  return `<li><a class="row" href="#/s/${id}"><span><span class="t">${hl(s.name)}</span><span class="s">${alias ? `Also called “${hl(alias)}” ·` : ""}${s.kind === "landrace" ? "Landrace ·" : ""} ${pill(s.lineage, true)}</span></span>${icon("chev", "chev")}</a></li>`;
}
function journalEntries() { return [...state.extraJournal, ...J].filter(e => !state.deleted[e.id]); }

function aboutScreen() {
  const treeOnly = `<ul class="tree" aria-label="Worked example family tree">${treeNode("kestrel-haze", 0, true)}</ul>`;
  return `<main class="screen about"><div class="appbar"><button class="icon-btn" type="button" data-act="back" aria-label="Back">${icon("back")}</button></div>
    <h1 class="display page-title" tabindex="-1" data-focus>About FlowerScan</h1>
    <nav class="toc" aria-label="On this page"><a href="#/about" data-scroll="classification">How it works</a><a href="#/about" data-scroll="limits">What it can't tell you</a><a href="#/about" data-scroll="sources">Our data</a><a href="#/about" data-scroll="tags">Tags</a><a href="#/about" data-scroll="privacy">Privacy</a><a href="#/about" data-scroll="responsible-use">Responsible use</a></nav>
    <h2 id="classification">How classification works</h2>
    <p>We look up the strain's family tree in our database and average how its ancestors are usually classified, back to traditional landraces where we can. The result is a <b>lineage estimate</b>: a number from 0 (indica) to 100 (sativa), and a label.</p>
    <p class="caption">Worked example with fictional strains:</p><div class="group" style="padding:8px 14px">${treeOnly}</div>
    <table class="bands" aria-label="Label bands"><tbody><tr><td>${pill({ label: "indica" })}</td><td>0–20</td></tr><tr><td>${pill({ label: "hybrid" })} Indica-dominant</td><td>21–40</td></tr>
      <tr><td>${pill({ label: "hybrid" })} Balanced</td><td>41–59</td></tr><tr><td>${pill({ label: "hybrid" })} Sativa-dominant</td><td>60–79</td></tr><tr><td>${pill({ label: "sativa" })}</td><td>80–100</td></tr></tbody></table>
    <ul class="plain"><li><b>Lineage traced:</b> every branch reaches sourced data.</li><li><b>Partly traced:</b> some branches end early, so we use how sources describe those strains.</li><li><b>Breeder's label:</b> no family tree yet, only how it's described.</li><li><b>Unknown lineage:</b> not enough data, so we don't estimate.</li></ul>
    <h2 id="limits">What it can't tell you</h2>
    <p><b>We match the name on the package. We can't confirm what's inside.</b></p>
    <p>Indica and sativa describe plant families, not how you'll feel. Effects vary person to person.</p>
    <p>Research finds the market labels "indica" and "sativa" track aroma more than overall genetics, so treat the label as a guide to family history.</p>
    <p>When sources disagree about a strain's parents, we show the best-supported version and mark it "lineage disputed".</p>
    <h2 id="sources">Where our data comes from</h2>
    <p>Breeder sites, published books, lab data and open datasets we're allowed to use. Every fact cites a source, and a person on our team checks each strain before it's marked verified.</p>
    <p><b>No brand pays for results. No ads.</b></p>
    <h2 id="tags">What the tags mean</h2>
    <p>Tags show what sources commonly report for a strain. They aren't promises, and effects vary person to person.</p>
    <ul class="plain"><li><b>Uplifted:</b> often described as a brighter, more upbeat mood.</li><li><b>Relaxed:</b> often described as feeling loose and unhurried.</li><li><b>Dry mouth:</b> a commonly reported downside.</li></ul>
    <p class="caption">Sample descriptions for the mockup. The real list renders from the taxonomy (T-003).</p>
    <h2 id="privacy">Privacy</h2>
    <p><b>Your camera images never leave your phone.</b> Text reading, matching and your journal all happen on this phone. We don't store photos. No account, no ads, no trackers.</p>
    <p>Some packages print potency numbers. We keep them with your saved scan on this phone, and we don't show them.</p>
    <p>Erase all data in Settings deletes everything.</p>
    <h2 id="responsible-use">Responsible use</h2>
    <p>FlowerScan is for adults 21 and older. Effects vary person to person. Start low, go slow. Don't drive after using cannabis. Follow your state's laws.</p>
    <p class="caption">Draft copy for legal review (Q10).</p>${tabbar("settings")}</main>`;
}

  const codeOpts = [["remembered", "Remembered barcode → result"], ["unknown", "Unknown barcode"], ["tracking", "Tracking code"], ["coa", "Lab-results QR"]];
  return `<div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:17px">Prototype controls</b><button class="pbtn" type="button" data-proto="close">Close</button></div>
    <p class="disc">Not part of the design. Fictional sample data: every strain, lineage, tag and source count here is invented. Tokens are placeholders until Roy's identity lands (Q11). Tap the package's barcode on the scanner to simulate a code coming into view; tap the shutter to read text.</p>
    <h2>Simulation</h2><p class="disc"><label>Shutter leads to <select data-proto="shutter">${shutterOpts.map(([v, l]) => `<option value="${v}" ${state.shutter === v ? "selected" : ""}>${l}</option>`).join("")}</select></label></p>
    <p class="disc"><label>Barcode tap leads to <select data-proto="code">${codeOpts.map(([v, l]) => `<option value="${v}" ${state.code === v ? "selected" : ""}>${l}</option>`).join("")}</select></label></p>
    <div class="links"><button class="pbtn" type="button" data-proto="theme">Theme: ${document.documentElement.dataset.theme}</button><button class="pbtn" type="button" data-proto="rm">Reduced motion: ${document.documentElement.classList.contains("rm") ? "on" : "off"}</button><button class="pbtn" type="button" data-proto="hide">Hide this button</button></div>
    ${PROTO.map(([g, ls]) => `<h2>${g}</h2><div class="links">${ls.map(([l, h]) => `<a href="${h}" data-proto="nav">${l}</a>`).join("")}</div>`).join("")}`;
}
const pbtn = $("#proto-btn"), proto = $("#proto");
pbtn.onclick = () => { proto.innerHTML = protoMenu(); proto.hidden = false; pbtn.setAttribute("aria-expanded", "true"); };
proto.addEventListener("click", ev => {
  const t = ev.target.closest("[data-proto]"); if (!t) return;
  const k = t.dataset.proto;
  if (k === "close" || k === "nav") { proto.hidden = true; pbtn.setAttribute("aria-expanded", "false"); }
  if (k === "theme") { state.theme = document.documentElement.dataset.theme === "dark" ? "light" : "dark"; applyTheme(); proto.innerHTML = protoMenu(); route(); }
  if (k === "rm") { document.documentElement.classList.toggle("rm"); proto.innerHTML = protoMenu(); }
  if (k === "hide") { proto.hidden = true; pbtn.hidden = true; }
});
proto.addEventListener("change", ev => { const t = ev.target; if (t.dataset.proto === "shutter") state.shutter = t.value; if (t.dataset.proto === "code") state.code = t.value; });

window.addEventListener("hashchange", route);
applyTheme();
route();
</script>
</body>
</html>
